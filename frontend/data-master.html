<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Master - Rosalina Collection</title>
    <!-- Menggunakan Tailwind CSS untuk desain tabel dan layout responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <!-- Layout Utama -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigasi Admin -->
        <div class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-5 text-xl font-bold tracking-wider border-b border-slate-800">
                Rosalina Collection
            </div>
            <nav class="flex-1 p-4 space-y-2 text-sm">
                <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800">Dashboard</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium">Data Master</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800">Manajemen Produksi</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800">Laporan Produksi</a>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
                Login sebagai: Admin[cite: 13, 14]
            </div>
        </div>

        <!-- Konten Utama -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Header Halaman -->
            <header class="bg-white shadow-sm p-6 flex justify-between items-center">
                <h1 class="text-xl font-bold text-slate-800">Pengelolaan Data Master (Kain & Model)</h1>
                <span class="text-sm text-slate-500">Modul Admin</span>
            </header>

            <!-- Isi Konten / Tabel Data -->
            <main class="p-6 space-y-6">
                
                <!-- Card Tabel Data Kain -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-700">Daftar Stok Kain Utama</h2>
                        <button class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                            + Tambah Kain Baru
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 border-b">
                                    <th class="p-3">ID Kain</th>
                                    <th class="p-3">Nama Kain</th>
                                    <th class="p-3">Jenis</th>
                                    <th class="p-3">Stok (Meter)</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-slate-700">
                                <tr>
                                    <td class="p-3">K001</td>
                                    <td class="p-3">Katun Combed 30s</td>
                                    <td class="p-3">Katun</td>
                                    <td class="p-3">150</td>
                                    <td class="p-3 text-center space-x-2">
                                        <button class="text-blue-600 hover:underline">Edit</button>
                                        <button class="text-red-600 hover:underline">Hapus</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="p-3">K002</td>
                                    <td class="p-3">Denim Jeans Standard</td>
                                    <td class="p-3">Denim</td>
                                    <td class="p-3">85</td>
                                    <td class="p-3 text-center space-x-2">
                                        <button class="text-blue-600 hover:underline">Edit</button>
                                        <button class="text-red-600 hover:underline">Hapus</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
